name: Deploy to Fly.io

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Base MCP URL to verify after deploy"
        type: string
        default: https://hexpm-mcp.fly.dev/mcp
  workflow_call:
    inputs:
      url:
        description: "Base MCP URL to verify after deploy"
        type: string
        default: https://hexpm-mcp.fly.dev/mcp
    secrets:
      FLY_API_TOKEN:
        required: true

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    if: github.repository == 'joshrotenberg/hexpm-mcp'
    environment:
      name: production
      url: ${{ inputs.url }}
    env:
      MCP_URL: ${{ inputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@1.5

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify deployment (MCP protocol)
        run: |
          echo "Waiting for server to be ready..."
          sleep 30

          MAX_RETRIES=3
          RETRY_DELAY=10

          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "=== Attempt $attempt of $MAX_RETRIES ==="

            echo "Sending server discovery request..."
            DISCOVERY_RESPONSE=$(curl -s -X POST "$MCP_URL" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json, text/event-stream" \
              -H "MCP-Protocol-Version: 2026-07-28" \
              -H "Mcp-Method: server/discover" \
              -d '{"jsonrpc":"2.0","id":1,"method":"server/discover","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{}}}}')

            echo "Discovery response: $DISCOVERY_RESPONSE"

            if ! echo "$DISCOVERY_RESPONSE" | grep -q '"supportedVersions".*"2026-07-28"'; then
              echo "MCP discovery failed"
              if [ $attempt -lt $MAX_RETRIES ]; then
                echo "Retrying in ${RETRY_DELAY}s..."
                sleep $RETRY_DELAY
                continue
              fi
              exit 1
            fi

            echo "Sending test tool call..."
            TOOL_RESPONSE=$(curl -s -X POST "$MCP_URL" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json, text/event-stream" \
              -H "MCP-Protocol-Version: 2026-07-28" \
              -H "Mcp-Method: tools/call" \
              -H "Mcp-Name: search" \
              -d '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"search","arguments":{"query":"phoenix"},"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{}}}}')

            echo "Tool response: $TOOL_RESPONSE"

            if echo "$TOOL_RESPONSE" | grep -q '"result"'; then
              echo "MCP protocol verification successful!"
              exit 0
            else
              echo "MCP protocol verification failed"
              if [ $attempt -lt $MAX_RETRIES ]; then
                echo "Retrying in ${RETRY_DELAY}s..."
                sleep $RETRY_DELAY
                continue
              fi
              exit 1
            fi
          done
